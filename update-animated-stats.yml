name: Update animated GitHub stats

on:
  push:
    branches: [main]
  schedule:
    # Runs every 6 hours so pushes to *other* repos get picked up automatically
    # (a workflow only fires on events to the repo it lives in, not your whole account)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button for on-demand refreshes

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate animated stat SVGs from live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: vishurrrr
        run: python scripts/generate_profile_svgs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animated-lang-stats.svg animated-contributions.svg
          git diff --staged --quiet || git commit -m "chore: refresh animated stats [skip ci]"
          git push
